version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: securechat
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: securechat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securechat -d securechat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://securechat:securepassword@db:5432/securechat_db?schema=public
      - JWT_SECRET=supersecretfallback_pleasechange
      - SERVER_PORT=4000
      - CLIENT_URL=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push --schema=../../prisma/schema.prisma && npm start"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      - server

volumes:
  postgres_data:
